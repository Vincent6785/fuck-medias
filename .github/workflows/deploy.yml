name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque job déclare explicitement ce dont il a besoin.
permissions: {}

concurrency:
  group: pages
  # false (et non true) : on ne coupe pas un déploiement Pages en cours, au
  # risque de laisser l'environnement dans un état incohérent.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege : le build exécute du code tiers (npm ci/test), il n'a
    # besoin que de lire le dépôt. Les droits Pages/OIDC restent au job deploy.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Active GitHub Pages (source « GitHub Actions ») si ce n'est pas déjà fait.
      # Placé ici car enablement nécessite pages:write, réservé au job deploy.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
